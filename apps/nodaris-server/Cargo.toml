[package]
name = "nodaris-server"
version = "0.1.0"
edition = "2021"

[dependencies]
nodaris-core = { path = "../../crates/nodaris-core" }
nodaris-linux = { path = "../../crates/nodaris-linux" }

# Веб-сервер
axum = "0.8.9"
tokio = { workspace = true }

# Сериализация
serde = { workspace = true }
serde_json = { workspace = true }

# Утилиты для сервера (CORS, статика)
tower-http = { version = "0.7.1", features = ["fs", "cors"] }